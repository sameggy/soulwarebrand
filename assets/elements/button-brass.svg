<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brass Button Template - Ready to add text in Canva -->

  <defs>
    <linearGradient id="brass-button-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Button background -->
  <rect x="2" y="2" width="196" height="56" rx="2" fill="url(#brass-button-gradient)"/>

  <!-- Border -->
  <rect x="2" y="2" width="196" height="56" rx="2" stroke="#B8860B" stroke-width="2" fill="none"/>

  <!-- Technical corner marks -->
  <line x1="10" y1="2" x2="10" y2="10" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>
  <line x1="2" y1="10" x2="10" y2="10" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>

  <line x1="190" y1="2" x2="190" y2="10" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>
  <line x1="190" y1="10" x2="198" y2="10" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>

  <line x1="10" y1="58" x2="10" y2="50" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>
  <line x1="2" y1="50" x2="10" y2="50" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>

  <line x1="190" y1="58" x2="190" y2="50" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>
  <line x1="190" y1="50" x2="198" y2="50" stroke="#2B2D2F" stroke-width="1" opacity="0.3"/>

  <!-- Add text in Canva centered at x=100, y=30 -->
</svg>