<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Corner Bracket - Blueprint style corner decoration -->
  <!-- Can be rotated and placed in 4 corners -->

  <!-- Outer bracket -->
  <path d="M 20 10 L 10 10 L 10 20" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Inner bracket -->
  <path d="M 20 16 L 16 16 L 16 20" stroke="#D4AF37" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Measurement marks -->
  <line x1="10" y1="12" x2="8" y2="12" stroke="#D4AF37" stroke-width="1"/>
  <line x1="12" y1="10" x2="12" y2="8" stroke="#D4AF37" stroke-width="1"/>
</svg>