<svg width="800" height="4" viewBox="0 0 800 4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brass Divider - Gradient line for section separation -->

  <defs>
    <linearGradient id="brass-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#D4AF37;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#D4AF37;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="2" x2="800" y2="2" stroke="url(#brass-gradient)" stroke-width="2"/>
</svg>