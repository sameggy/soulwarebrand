<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint Grid Pattern - 20x20px grid -->
  <!-- Use as background with appropriate opacity -->

  <defs>
    <pattern id="blueprint-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <!-- Vertical line -->
      <line x1="0" y1="0" x2="0" y2="20" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>
      <!-- Horizontal line -->
      <line x1="0" y1="0" x2="20" y2="0" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>
      <!-- Corner marks every 5th line (would be thicker in actual use) -->
    </pattern>

    <pattern id="blueprint-grid-major" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Major grid lines every 5 units -->
      <line x1="0" y1="0" x2="0" y2="100" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="100" y2="0" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#2B2D2F"/>

  <!-- Grid pattern -->
  <rect width="400" height="400" fill="url(#blueprint-grid)"/>
  <rect width="400" height="400" fill="url(#blueprint-grid-major)"/>
</svg>