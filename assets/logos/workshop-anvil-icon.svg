<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Workshop Anvil Icon - Main Brand Mark -->
  <!-- Geometric anvil with negative space "W" and blueprint grid -->

  <!-- Base of anvil -->
  <path d="M 40 160 L 160 160 L 160 170 L 40 170 Z" fill="#D4AF37" stroke="#D4AF37" stroke-width="2"/>

  <!-- Main body with W negative space -->
  <path d="M 50 80 L 50 160 L 70 160 L 85 120 L 100 140 L 115 120 L 130 160 L 150 160 L 150 80 Z" fill="#D4AF37" stroke="#D4AF37" stroke-width="2" stroke-linejoin="miter"/>

  <!-- Top working surface with blueprint grid -->
  <rect x="50" y="60" width="100" height="20" fill="#D4AF37" stroke="#D4AF37" stroke-width="2"/>

  <!-- Blueprint grid pattern on top surface -->
  <line x1="60" y1="60" x2="60" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="70" y1="60" x2="70" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="80" y1="60" x2="80" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="90" y1="60" x2="90" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="60" x2="100" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="110" y1="60" x2="110" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="120" y1="60" x2="120" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="130" y1="60" x2="130" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="140" y1="60" x2="140" y2="80" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>

  <line x1="50" y1="65" x2="150" y2="65" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="70" x2="150" y2="70" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="75" x2="150" y2="75" stroke="#2B2D2F" stroke-width="0.5" opacity="0.3"/>

  <!-- Horn of anvil (left) -->
  <path d="M 30 80 L 50 80 L 50 100 L 35 100 Z" fill="#D4AF37" stroke="#D4AF37" stroke-width="2"/>

  <!-- Horn of anvil (right) -->
  <path d="M 150 80 L 170 80 L 165 100 L 150 100 Z" fill="#D4AF37" stroke="#D4AF37" stroke-width="2"/>
</svg>